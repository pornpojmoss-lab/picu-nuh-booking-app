<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5fa5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PICU NUH">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>PICU NUH Booking</title>
<style>
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:#f4f9fd}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#17324d}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(440px,100%);background:#fff;border-radius:28px;padding:30px 24px;box-shadow:0 18px 50px rgba(15,72,110,.14);text-align:center;border:1px solid #e2edf5}
.logo{width:160px;height:160px;object-fit:contain;display:block;margin:0 auto 14px}
h1{margin:0;color:#083b73;font-size:28px} h2{margin:6px 0 20px;color:#0b7f91;font-size:17px}
p{color:#60788d;line-height:1.6;font-size:14px}
.open,.install,.notify{display:block;width:100%;border-radius:15px;padding:15px;font-size:17px;font-weight:800;text-decoration:none}
.open{background:linear-gradient(90deg,#0b8c9a,#0b5fa5);color:white;box-shadow:0 8px 20px rgba(11,95,165,.20)}
.notify{margin-top:11px;border:0;background:#eaf6ff;color:#0b5fa5;cursor:pointer}
.notify:disabled{opacity:.65}.install{margin-top:11px;border:1px solid #cbddea;background:#f6fbff;color:#0b5fa5;cursor:pointer}
.fields{text-align:left;margin:14px 0 4px}.fields label{display:block;margin-top:8px;font-size:13px;font-weight:700;color:#52697a}
.fields input{width:100%;margin-top:5px;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}
.status{margin-top:12px;min-height:20px;color:#60788d;font-size:13px;word-break:break-word}
.status.ok{color:#087f5b;font-weight:700}.status.err{color:#b42318;font-weight:700}.note{margin-top:18px;color:#8094a5;font-size:12px}
</style></head>
<body><main><section class="card">
<img class="logo" src="./icons/icon-512.png" alt="PICU NUH Booking">
<h1>PICU NUH Booking</h1><h2>Naresuan University Hospital</h2><p>ระบบจองย้ายผู้ป่วยเข้า PICU</p>
<a class="open" href="https://script.google.com/macros/s/AKfycbwOUdVRJDwg1tKx79skIqVFCwtmpomCNlF-BsuG5yYsdQnwUR0CgLjuTHhkW8Uspsfw/exec">OPEN PICU NUH</a>
<div class="fields">
<label>PICU Username</label><input id="u" autocomplete="username" placeholder="เช่น picu01">
<label>Password</label><input id="p" type="password" autocomplete="current-password" placeholder="Password">
<label>ชื่อเครื่อง</label><input id="d" placeholder="เช่น S23 Ultra PICU 1">
</div>
<button class="notify" id="notifyBtn" type="button">🔔 เปิดและลงทะเบียนการแจ้งเตือน PICU</button>
<div class="status" id="status"></div>
<button class="install" id="installBtn" hidden>INSTALL APP</button>
<div class="note">For authorized hospital users</div>
</section></main>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyC-j08I700S-ITpy8ei0fDEZCM-i0wyLnw",authDomain:"picu-book.firebaseapp.com",projectId:"picu-book",storageBucket:"picu-book.firebasestorage.app",messagingSenderId:"99258359831",appId:"1:99258359831:web:3817b4b060e5db95967c52"};
const VAPID_KEY="BBimMUnY0ng-wuj1PJ4iRdkprhwkgmpvlURoLcL9V4BqG6Fj-dh4GIHvdrSToCqFxKdgrP6KdjCQazMRvTpWcmE";
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwOUdVRJDwg1tKx79skIqVFCwtmpomCNlF-BsuG5yYsdQnwUR0CgLjuTHhkW8Uspsfw/exec";
firebase.initializeApp(firebaseConfig); const messaging=firebase.messaging();
let deferredPrompt=null;
const btn=document.getElementById("notifyBtn"), statusEl=document.getElementById("status"), installBtn=document.getElementById("installBtn");
function status(t,c){statusEl.textContent=t;statusEl.className="status "+(c||"")}
async function sw(){let r=await navigator.serviceWorker.getRegistration("./");if(!r)r=await navigator.serviceWorker.register("./sw.js",{scope:"./"});await navigator.serviceWorker.ready;return r}
function postRegistration(token){
  const u=document.getElementById("u").value.trim(),p=document.getElementById("p").value,d=document.getElementById("d").value.trim()||navigator.userAgent;
  if(!u||!p)throw new Error("กรุณากรอก PICU Username และ Password");
  const f=document.createElement("form"); f.method="POST";f.action=SCRIPT_URL;f.target="regFrame";f.style.display="none";
  ({action:"registerFcmDevice",username:u,password:p,deviceToken:token,deviceName:d});
  const data={action:"registerFcmDevice",username:u,password:p,deviceToken:token,deviceName:d};
  Object.keys(data).forEach(k=>{const i=document.createElement("input");i.type="hidden";i.name=k;i.value=data[k];f.appendChild(i)});
  document.body.appendChild(f);f.submit();setTimeout(()=>f.remove(),1500);document.getElementById("p").value="";
}
const fr=document.createElement("iframe");fr.name="regFrame";fr.hidden=true;document.body.appendChild(fr);
window.addEventListener("load",()=>sw().catch(console.error));
btn.addEventListener("click",async()=>{
  btn.disabled=true;status("กำลังลงทะเบียน...");
  try{
    if(!document.getElementById("u").value.trim()||!document.getElementById("p").value)throw new Error("กรุณากรอก PICU Username และ Password");
    const permission=await Notification.requestPermission();if(permission!=="granted")throw new Error("ยังไม่ได้อนุญาตการแจ้งเตือน");
    const reg=await sw();const token=await messaging.getToken({vapidKey:VAPID_KEY,serviceWorkerRegistration:reg});
    if(!token)throw new Error("Firebase ยังไม่สามารถสร้าง FCM token ได้");
    postRegistration(token);btn.textContent="✅ ส่งลงทะเบียนแล้ว";status("ส่ง Token ของเครื่องนี้เข้าสู่ระบบแล้ว","ok");
  }catch(e){status(e.message||String(e),"err")}finally{btn.disabled=false}
});
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;installBtn.hidden=false});
installBtn.addEventListener("click",async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.hidden=true});
</script></body></html>
